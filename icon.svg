<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b6bb0"/>
      <stop offset="100%" stop-color="#c9a8d8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 书本 -->
  <g transform="translate(120, 160)">
    <rect x="0" y="20" width="120" height="160" rx="12" fill="#fff" opacity="0.95"/>
    <rect x="120" y="0" width="32" height="200" rx="6" fill="#f0e6f5"/>
    <rect x="152" y="20" width="120" height="160" rx="12" fill="#fff" opacity="0.95"/>
    <!-- 左页线条 -->
    <line x1="20" y1="60" x2="100" y2="60" stroke="#9b6bb0" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="90" y2="90" stroke="#c9a8d8" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="115" x2="100" y2="115" stroke="#c9a8d8" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="140" x2="70" y2="140" stroke="#c9a8d8" stroke-width="6" stroke-linecap="round"/>
    <!-- 右页线条 -->
    <line x1="172" y1="60" x2="252" y2="60" stroke="#9b6bb0" stroke-width="8" stroke-linecap="round"/>
    <line x1="172" y1="90" x2="242" y2="90" stroke="#c9a8d8" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="115" x2="252" y2="115" stroke="#c9a8d8" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="140" x2="222" y2="140" stroke="#c9a8d8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 星星 -->
  <text x="256" y="130" text-anchor="middle" font-size="40">⭐</text>
</svg>
